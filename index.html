<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trehørningsvassdraget – interaktivt kart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:rgba(255,255,255,.88);--border:rgba(0,0,0,.16);--shadow:0 2px 12px rgba(0,0,0,.22);--blue:#1677ff}
html,body,#map{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent;background:#fff}
#map{position:absolute;inset:0}
.stop-marker{color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.stop-air{background:#1565c0}.stop-ground{background:#2e7d32}.stop-underwater{background:#e65100}
.legend{font-size:12px;line-height:1.7;margin-top:5px}.legend-item{display:flex;align-items:center;gap:7px}.legend-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);flex:none}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.82)!important}
.leaflet-popup-content-wrapper{border-radius:8px}.leaflet-popup-content{margin:10px 12px}
.map-btn{border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:var(--shadow);border-radius:8px;min-height:42px;padding:0 13px;font-size:14px;font-weight:600;color:#222;cursor:pointer}
#layerButton{position:absolute;z-index:1000;right:12px;top:12px}
#locateButton{position:absolute;z-index:1000;right:12px;bottom:38px;width:44px;padding:0;font-size:20px}
#layerPanel{position:absolute;z-index:1100;right:12px;top:62px;width:285px;max-width:calc(100% - 24px);padding:14px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);display:none;color:#222}
#layerPanel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panel-head strong{font-size:14px;letter-spacing:.03em}.xbtn{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;padding:4px 7px;border-radius:5px}
.row{display:flex;align-items:center;gap:9px;min-height:34px;font-size:14px}.row input[type=checkbox]{width:18px;height:18px}.section{border-top:1px solid rgba(0,0,0,.12);margin-top:9px;padding-top:10px}.range-head{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}.range{width:100%;accent-color:#555}
#nearInfo{font-size:12px;line-height:1.35;color:#444;margin-top:7px;min-height:16px}
#timeBox{position:absolute;display:none;z-index:1050;left:12px;bottom:32px;width:350px;max-width:calc(100% - 84px);box-sizing:border-box;padding:13px 38px 13px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);color:#222;font-size:13px;line-height:1.4}
#timeBox h2{font-size:15px;margin:0 0 5px}#timeBox p{margin:0}#timeClose{position:absolute;right:5px;top:5px}
#timeReopen{position:absolute;z-index:1000;left:12px;bottom:32px;display:block}
.user-dot{width:14px;height:14px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
@media(max-width:700px){#layerButton{top:8px;right:8px}#layerPanel{top:57px;right:8px;width:275px;padding:13px}#locateButton{right:8px;bottom:32px}#timeBox{left:8px;bottom:27px;max-width:calc(100% - 68px);width:330px;font-size:12.5px;padding:11px 34px 11px 12px}#timeBox h2{font-size:14px}#timeReopen{left:8px;bottom:27px}.map-btn{min-height:44px}.stop-marker{width:30px;height:30px;line-height:30px}}

.new-water-legend{font-size:12px;line-height:1.55;margin:5px 0 0 24px}
.pipe-key{display:flex;align-items:center;gap:7px;margin:3px 0}
.pipe-swatch{width:28px;height:0;display:inline-block;flex:none;border-top:3px solid #c62828}
.pipe-tunnel{border-top-style:dashed}
.pipe-submerged{border-top-style:solid}
.pipe-trench{border-top:3px dotted #c62828}

</style>
</head>
<body>
<div id="map" aria-label="Kart over Trehørningsvassdraget"></div>
<button id="layerButton" class="map-btn" type="button" aria-expanded="false">Kartlag</button>
<div id="layerPanel" role="dialog" aria-label="Kartlag">
  <div class="panel-head"><strong>KARTLAG</strong><button id="panelClose" class="xbtn" type="button" aria-label="Lukk kartlag">×</button></div>
  <label class="row"><input id="stopsToggle" type="checkbox" checked> Fotopunkter</label>
  <div class="legend" aria-label="Tegnforklaring for fotopunkter">
    <div class="legend-item"><span class="legend-dot stop-air"></span><span>Luft</span></div>
    <div class="legend-item"><span class="legend-dot stop-ground"></span><span>Bakke</span></div>
    <div class="legend-item"><span class="legend-dot stop-underwater"></span><span>Under vann</span></div>
  </div>

  <div class="section">
    <label class="row"><input id="newWaterwayToggle" type="checkbox"> Ny vannvei</label>
    <div class="new-water-legend" aria-label="Seksjoner i ny vannvei">
      <div class="pipe-key"><span class="pipe-swatch pipe-tunnel"></span><span>Boret vanntunnel</span></div>
      <div class="pipe-key"><span class="pipe-swatch pipe-submerged"></span><span>Nedsenket rør</span></div>
      <div class="pipe-key"><span class="pipe-swatch pipe-trench"></span><span>Rør i grøft</span></div>
    </div>
  </div>
  <div class="section">
    <label class="row"><input id="reliefToggle" type="checkbox" checked> Terrengrelieff</label>
    <div class="range-head"><span>Relieffstyrke</span><span id="reliefValue">45 %</span></div>
    <input id="reliefRange" class="range" type="range" min="0" max="100" value="45" aria-label="Relieffstyrke">
  </div>
  <div class="section">
    <label class="row"><input id="locationToggle" type="checkbox"> Min posisjon</label>
    <label class="row"><input id="nearestToggle" type="checkbox"> Linje til nærmeste fotopunkt</label>
    <div id="nearInfo">Posisjon er ikke aktivert.</div>
  </div>
</div>
<button id="locateButton" class="map-btn" type="button" title="Vis min posisjon" aria-label="Vis min posisjon">◎</button>
<div id="timeBox">
  <button id="timeClose" class="xbtn" type="button" aria-label="Lukk informasjon">×</button>
  <h2>Om kartet</h2>
  <p>Kartet viser vassdraget og fotopunktene i dokumentasjonen. Kart- og terrengdata leveres av Kartverket og kan oppdateres over tid.</p>
</div>
<button id="timeReopen" class="map-btn" type="button" aria-label="Om kartet">ⓘ Om kartet</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const points={"type":"FeatureCollection","features":[
{"type":"Feature","properties":{"number":1,"chapter":"1/20"},"geometry":{"type":"Point","coordinates":[10.4381774,60.0133233]}},{"type":"Feature","properties":{"number":2,"chapter":"2/20"},"geometry":{"type":"Point","coordinates":[10.4372333,60.0142479]}},{"type":"Feature","properties":{"number":3,"chapter":"3/20"},"geometry":{"type":"Point","coordinates":[10.4344614,60.0173123]}},{"type":"Feature","properties":{"number":4,"chapter":"4/20"},"geometry":{"type":"Point","coordinates":[10.4343084,60.0180639]}},{"type":"Feature","properties":{"number":5,"chapter":"5/20"},"geometry":{"type":"Point","coordinates":[10.4345013,60.017636]}},{"type":"Feature","properties":{"number":6,"chapter":"6/20"},"geometry":{"type":"Point","coordinates":[10.4344023,60.0171108]}},{"type":"Feature","properties":{"number":7,"chapter":"7/20"},"geometry":{"type":"Point","coordinates":[10.4344704,60.0171112]}},{"type":"Feature","properties":{"number":8,"chapter":"8/20"},"geometry":{"type":"Point","coordinates":[10.4346985,60.0160577]}},{"type":"Feature","properties":{"number":9,"chapter":"9/20"},"geometry":{"type":"Point","coordinates":[10.4346127,60.0153928]}},{"type":"Feature","properties":{"number":10,"chapter":"10/20"},"geometry":{"type":"Point","coordinates":[10.4360421,60.0145224]}},{"type":"Feature","properties":{"number":11,"chapter":"11/20"},"geometry":{"type":"Point","coordinates":[10.4450646,60.0120054]}},{"type":"Feature","properties":{"number":12,"chapter":"12/20"},"geometry":{"type":"Point","coordinates":[10.4502894,60.007695]}},{"type":"Feature","properties":{"number":13,"chapter":"13/20"},"geometry":{"type":"Point","coordinates":[10.4501097,60.0079727]}},{"type":"Feature","properties":{"number":14,"chapter":"14/20"},"geometry":{"type":"Point","coordinates":[10.4454994,60.0043004]}},{"type":"Feature","properties":{"number":15,"chapter":"15/20"},"geometry":{"type":"Point","coordinates":[10.4431765,60.0065153]}},{"type":"Feature","properties":{"number":16,"chapter":"16/20"},"geometry":{"type":"Point","coordinates":[10.4442118,60.0057752]}},{"type":"Feature","properties":{"number":17,"chapter":"17/20"},"geometry":{"type":"Point","coordinates":[10.4464354,60.0037412]}},{"type":"Feature","properties":{"number":18,"chapter":"18/20"},"geometry":{"type":"Point","coordinates":[10.4479669,60.0034109]}},{"type":"Feature","properties":{"number":19,"chapter":"19/20"},"geometry":{"type":"Point","coordinates":[10.4465722,60.0037166]}},{"type":"Feature","properties":{"number":20,"chapter":"20/20"},"geometry":{"type":"Point","coordinates":[10.455449,60.002505]}}]};


// Ny vannvei – koordinater hentet direkte fra opplastet KMZ.
const newWaterwaySections=[
  {
    name:'Boret vanntunnel',
    type:'tunnel',
    coords:[
      [60.0184036,10.4350082],
      [60.0160766,10.4350511],
      [60.0148219,10.4364244]
    ]
  },
  {
    name:'Nedsenket rør',
    type:'submerged',
    coords:[
      [60.0148219,10.4364244],
      [60.0138595,10.4374007]
    ]
  },
  {
    name:'Rør i grøft',
    type:'trench',
    coords:[
      [60.0138595,10.4374007],
      [60.0132187,10.4380873],
      [60.0128835,10.4388491],
      [60.0127119,10.4400936],
      [60.0126529,10.4412094],
      [60.0121274,10.4441813],
      [60.0119263,10.4448519],
      [60.0107948,10.4468689],
      [60.0102586,10.4477004],
      [60.0094622,10.4486070],
      [60.0091082,10.4491756],
      [60.0086765,10.4495726],
      [60.0082287,10.4498891],
      [60.0077889,10.4503611],
      [60.0075261,10.4506991],
      [60.0071453,10.4513321],
      [60.0067029,10.4523513],
      [60.0064293,10.4528610],
      [60.0057884,10.4540358],
      [60.0054934,10.4544327],
      [60.0051099,10.4544005],
      [60.0040935,10.4541967]
    ]
  },
  {
    name:'Nedsenket rør',
    type:'submerged',
    coords:[
      [60.0040935,10.4541967],
      [60.0031435,10.4538064],
      [60.0021243,10.4533987],
      [60.0010193,10.4544502],
      [59.9999786,10.4569178],
      [59.9990989,10.4576688],
      [59.9977792,10.4583769],
      [59.9966525,10.4597073]
    ]
  }
];

const map=L.map('map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true,touchZoom:true,dragging:true,doubleClickZoom:true,boxZoom:false,keyboard:true});
const base=L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{attribution:'&copy; Kartverket',maxZoom:18,minZoom:5,crossOrigin:true}).addTo(map);

// Kartverkets/Høydedatas nasjonale DTM-WMS. Laget DTM:skyggerelieff viser siste prosjekt som oppdaterer nasjonal høydemodell.
const relief=L.tileLayer.wms('https://wms.geonorge.no/skwms1/wms.hoyde-dtm',{layers:'DTM:skyggerelieff',format:'image/png',transparent:true,version:'1.3.0',opacity:0,attribution:'Terrengdata © Kartverket',maxZoom:19}).addTo(map);


const newWaterway=L.layerGroup();
const sectionStyles={
  tunnel:{color:'#c62828',weight:4,opacity:.9,dashArray:'10 7'},
  submerged:{color:'#c62828',weight:4,opacity:.9},
  trench:{color:'#c62828',weight:4,opacity:.9,dashArray:'2 7'}
};
newWaterwaySections.forEach(section=>{
  L.polyline(section.coords,sectionStyles[section.type])
    .bindTooltip(section.name,{sticky:true})
    .addTo(newWaterway);
});

const airPoints=new Set([1,2,3,11,12,14,20]);
const groundPoints=new Set([4,5,6,8,13,15,16,17,18]);
const underwaterPoints=new Set([7,9,10,19]);
function pointType(n){return airPoints.has(n)?'air':underwaterPoints.has(n)?'underwater':'ground'}
function pointTypeLabel(n){return airPoints.has(n)?'Luft':underwaterPoints.has(n)?'Under vann':'Bakke'}
const stops=L.geoJSON(points,{pointToLayer:(f,ll)=>{const type=pointType(f.properties.number);return L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="stop-marker stop-${type}">${f.properties.number}</div>`,iconSize:[34,34],iconAnchor:[17,17]})})},onEachFeature:(f,l)=>l.bindPopup(`<strong>${f.properties.chapter}</strong><br>${pointTypeLabel(f.properties.number)}`,{autoPan:true})}).addTo(map);
const bounds=stops.getBounds();
function setInitialView(){const mobile=matchMedia('(max-width:700px)').matches;if(bounds.isValid())map.fitBounds(bounds.pad(mobile?.24:.12),{padding:mobile?[24,24]:[18,18],maxZoom:mobile?14:15});else map.setView([60.01,10.44],14)}
setInitialView();

const $=id=>document.getElementById(id);
const panel=$('layerPanel'),layerButton=$('layerButton'),range=$('reliefRange'),reliefValue=$('reliefValue'),reliefToggle=$('reliefToggle');
function panelOpen(on){panel.classList.toggle('open',on);layerButton.setAttribute('aria-expanded',String(on))}
layerButton.addEventListener('click',()=>panelOpen(!panel.classList.contains('open')));$('panelClose').addEventListener('click',()=>panelOpen(false));
$('stopsToggle').addEventListener('change',e=>e.target.checked?stops.addTo(map):map.removeLayer(stops));

$('newWaterwayToggle').addEventListener('change',e=>{
  e.target.checked ? newWaterway.addTo(map) : map.removeLayer(newWaterway);
});

function setRelief(v){v=Math.max(0,Math.min(100,Number(v)||0));range.value=v;reliefValue.textContent=Math.round(v)+' %';relief.setOpacity(reliefToggle.checked?v/100:0)}
range.addEventListener('input',()=>{stopIntro();setRelief(range.value)});
reliefToggle.addEventListener('change',()=>setRelief(range.value));

let introRAF=null,introStart=null;const introDuration=10000,introTarget=45;
function stopIntro(){if(introRAF){cancelAnimationFrame(introRAF);introRAF=null}}
function introStep(t){if(!introStart)introStart=t;const p=Math.min(1,(t-introStart)/introDuration);setRelief(introTarget*p);if(p<1)introRAF=requestAnimationFrame(introStep);else introRAF=null}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)introRAF=requestAnimationFrame(introStep);else setRelief(introTarget);

$('timeClose').addEventListener('click',()=>{$('timeBox').style.display='none';$('timeReopen').style.display='block'});$('timeReopen').addEventListener('click',()=>{$('timeBox').style.display='block';$('timeReopen').style.display='none'});

let watchId=null,userMarker=null,accuracyCircle=null,nearestLine=null,lastPosition=null;
const userIcon=L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]});
function distanceM(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng),la1=rad(a.lat),la2=rad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function nearestStop(ll){let best=null;points.features.forEach(f=>{const [lng,lat]=f.geometry.coordinates,d=distanceM(ll,{lat,lng});if(!best||d<best.d)best={d,f,ll:L.latLng(lat,lng)}});return best}
function updateNearest(){if(nearestLine){map.removeLayer(nearestLine);nearestLine=null}if(!lastPosition){$('nearInfo').textContent='Posisjon er ikke aktivert.';return}const n=nearestStop(lastPosition);$('nearInfo').textContent=`Nærmeste fotopunkt: ${n.f.properties.chapter} · ${Math.round(n.d)} m`;if($('nearestToggle').checked)nearestLine=L.polyline([lastPosition,n.ll],{weight:2,dashArray:'6 6',opacity:.8}).addTo(map)}
function onPosition(pos){const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);lastPosition=ll;if(!userMarker)userMarker=L.marker(ll,{icon:userIcon,zIndexOffset:1000}).addTo(map);else userMarker.setLatLng(ll);if(!accuracyCircle)accuracyCircle=L.circle(ll,{radius:pos.coords.accuracy||0,weight:1,opacity:.45,fillOpacity:.08}).addTo(map);else accuracyCircle.setLatLng(ll).setRadius(pos.coords.accuracy||0);updateNearest()}
function onPositionError(err){$('nearInfo').textContent='Posisjon kunne ikke hentes: '+err.message;$('locationToggle').checked=false}
function startLocation(center=false){if(!navigator.geolocation){$('nearInfo').textContent='Nettleseren støtter ikke posisjon.';return}$('locationToggle').checked=true;if(watchId===null)watchId=navigator.geolocation.watchPosition(onPosition,onPositionError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});if(center)navigator.geolocation.getCurrentPosition(p=>{onPosition(p);map.setView([p.coords.latitude,p.coords.longitude],Math.max(map.getZoom(),16))},onPositionError,{enableHighAccuracy:true,timeout:15000})}
function stopLocation(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(userMarker){map.removeLayer(userMarker);userMarker=null}if(accuracyCircle){map.removeLayer(accuracyCircle);accuracyCircle=null}if(nearestLine){map.removeLayer(nearestLine);nearestLine=null}lastPosition=null;updateNearest()}
$('locationToggle').addEventListener('change',e=>e.target.checked?startLocation(false):stopLocation());$('nearestToggle').addEventListener('change',()=>{if(!lastPosition&&$('nearestToggle').checked)startLocation(false);updateNearest()});$('locateButton').addEventListener('click',()=>startLocation(true));

function resizeMap(){setTimeout(()=>map.invalidateSize(false),0)}window.addEventListener('resize',resizeMap);window.addEventListener('orientationchange',()=>setTimeout(resizeMap,250));window.addEventListener('load',resizeMap);
</script>
</body>
</html>
