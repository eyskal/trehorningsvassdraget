<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trehørningsvassdraget – Kartverket</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
#map{position:absolute;inset:0;width:100%;height:100%;}
body{font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.stop-marker{background:#e65100;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.82)!important}
.leaflet-popup-content-wrapper{border-radius:6px}
.leaflet-popup-content{margin:10px 12px}
</style>
</head>
<body>
<div id="map" aria-label="Kart over Trehørningsvassdraget"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const points = {"type": "FeatureCollection", "name": "Trehorningsvassdraget_points", "features": [{"type": "Feature", "properties": {"name": "1/20", "number": 1, "chapter": "1/20"}, "geometry": {"type": "Point", "coordinates": [10.4381774, 60.0133233]}}, {"type": "Feature", "properties": {"name": "2/20", "number": 2, "chapter": "2/20"}, "geometry": {"type": "Point", "coordinates": [10.4372333, 60.0142479]}}, {"type": "Feature", "properties": {"name": "3/20", "number": 3, "chapter": "3/20"}, "geometry": {"type": "Point", "coordinates": [10.4344614, 60.0173123]}}, {"type": "Feature", "properties": {"name": "4/20", "number": 4, "chapter": "4/20"}, "geometry": {"type": "Point", "coordinates": [10.4343084, 60.0180639]}}, {"type": "Feature", "properties": {"name": "5/20", "number": 5, "chapter": "5/20"}, "geometry": {"type": "Point", "coordinates": [10.4345013, 60.017636]}}, {"type": "Feature", "properties": {"name": "6/20", "number": 6, "chapter": "6/20"}, "geometry": {"type": "Point", "coordinates": [10.4344023, 60.0171108]}}, {"type": "Feature", "properties": {"name": "7/20", "number": 7, "chapter": "7/20"}, "geometry": {"type": "Point", "coordinates": [10.4344704, 60.0171112]}}, {"type": "Feature", "properties": {"name": "8/20", "number": 8, "chapter": "8/20"}, "geometry": {"type": "Point", "coordinates": [10.4346985, 60.0160577]}}, {"type": "Feature", "properties": {"name": "9/20", "number": 9, "chapter": "9/20"}, "geometry": {"type": "Point", "coordinates": [10.4346127, 60.0153928]}}, {"type": "Feature", "properties": {"name": "10/20", "number": 10, "chapter": "10/20"}, "geometry": {"type": "Point", "coordinates": [10.4360421, 60.0145224]}}, {"type": "Feature", "properties": {"name": "11/20", "number": 11, "chapter": "11/20"}, "geometry": {"type": "Point", "coordinates": [10.4450646, 60.0120054]}}, {"type": "Feature", "properties": {"name": "12/20", "number": 12, "chapter": "12/20"}, "geometry": {"type": "Point", "coordinates": [10.4502894, 60.007695]}}, {"type": "Feature", "properties": {"name": "13/20", "number": 13, "chapter": "13/20"}, "geometry": {"type": "Point", "coordinates": [10.4501097, 60.0079727]}}, {"type": "Feature", "properties": {"name": "14/20", "number": 14, "chapter": "14/20"}, "geometry": {"type": "Point", "coordinates": [10.4454994, 60.0043004]}}, {"type": "Feature", "properties": {"name": "15/20", "number": 15, "chapter": "15/20"}, "geometry": {"type": "Point", "coordinates": [10.4431765, 60.0065153]}}, {"type": "Feature", "properties": {"name": "16/20", "number": 16, "chapter": "16/20"}, "geometry": {"type": "Point", "coordinates": [10.4442118, 60.0057752]}}, {"type": "Feature", "properties": {"name": "17/20", "number": 17, "chapter": "17/20"}, "geometry": {"type": "Point", "coordinates": [10.4464354, 60.0037412]}}, {"type": "Feature", "properties": {"name": "18/20", "number": 18, "chapter": "18/20"}, "geometry": {"type": "Point", "coordinates": [10.4479669, 60.0034109]}}, {"type": "Feature", "properties": {"name": "19/20", "number": 19, "chapter": "19/20"}, "geometry": {"type": "Point", "coordinates": [10.4465722, 60.0037166]}}, {"type": "Feature", "properties": {"name": "20/20", "number": 20, "chapter": "20/20"}, "geometry": {"type": "Point", "coordinates": [10.455449, 60.002505]}}]};

const map=L.map('map',{
 zoomControl:true,
 attributionControl:true,
 scrollWheelZoom:true,
 touchZoom:true,
 dragging:true,
 doubleClickZoom:true,
 boxZoom:false,
 keyboard:true,
 tap:true
});

L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{
 attribution:'&copy; <a href="https://www.kartverket.no/" target="_blank" rel="noopener">Kartverket</a>',
 maxZoom:18,
 minZoom:5,
 crossOrigin:true
}).addTo(map);

const stops=L.geoJSON(points,{
 pointToLayer:(feature,latlng)=>{
   const n=feature.properties.number ?? '';
   return L.marker(latlng,{icon:L.divIcon({className:'',html:`<div class="stop-marker">${n}</div>`,iconSize:[32,32],iconAnchor:[16,16]})});
 },
 onEachFeature:(feature,layer)=>{
   const p=feature.properties||{};
   layer.bindPopup(`<strong>${p.chapter||p.name||'Stopp'}</strong>`,{autoPan:true,closeButton:true});
 }
}).addTo(map);

const bounds=stops.getBounds();
if(bounds.isValid()) map.fitBounds(bounds.pad(0.10),{padding:[10,10]});
else map.setView([60.01,10.44],14);

function resizeMap(){ setTimeout(()=>map.invalidateSize(false),0); }
window.addEventListener('resize',resizeMap);
window.addEventListener('orientationchange',()=>setTimeout(resizeMap,250));
window.addEventListener('load',resizeMap);
</script>
</body>
</html>
